# ===================================================================
# VastraVerse Kotlin Spring Boot Configuration
# ===================================================================
server.port=5000

# H2 Database Configuration (Zero-setup embedded SQL with persistent or in-memory mode)
spring.datasource.url=jdbc:h2:file:./vastraverse_h2;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# H2 Web Console (Accessible at http://localhost:5000/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Logging
logging.level.com.vastraverse=INFO
logging.level.org.springframework.web=INFO
